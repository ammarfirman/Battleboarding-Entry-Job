name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run smoke tests
        run: npm test

      - name: Build standalone HTML
        run: npm run build

      - name: Package Windows desktop bundle
        run: npm run win:pack

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleboardingEntry-Windows-x64
          path: dist/BattleboardingEntry-Windows-x64.zip

      - name: Attach to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BattleboardingEntry-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}