name: Build iOS app

# Builds the Capacitor iOS project on a macOS runner, because Xcode only runs
# on macOS. Runs automatically when the app or the iOS project changes, and
# can be started by hand from the Actions tab.
#
# The build is UNSIGNED: the .ipa artifact runs on the iOS Simulator and can
# be resigned (AltStore, Sideloadly, fastlane), but will NOT install directly
# on an iPhone. For a device-installable signed build you need an Apple
# Developer account and code-signing secrets - see docs/ios.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle and sync into ios/
        run: |
          npm run build
          npx cap sync ios

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qr BattleboardingEntry-unsigned.ipa Payload
          ls -lh BattleboardingEntry-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BattleboardingEntry-ios-unsigned
          path: ${{ runner.temp }}/BattleboardingEntry-unsigned.ipa
          if-no-files-found: error
